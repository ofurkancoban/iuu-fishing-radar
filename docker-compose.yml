name: iuu-radar

x-common-env: &common-env
  GFW_API_TOKEN: ${GFW_API_TOKEN}
  API_BASE_URL: ${API_BASE_URL}
  CORS_ORIGIN: ${CORS_ORIGIN}
  REDIS_URL: redis://redis:6379/0
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  API_DOMAIN: ${API_DOMAIN}
  RATE_LIMIT: ${RATE_LIMIT}
  DEFAULT_REGION: ${DEFAULT_REGION}

services:
  # Not started by `up`; invoked by host cron as `docker compose run --rm pipeline`.
  pipeline:
    build: .
    image: iuu-radar:latest
    command: ["python", "-m", "iuu_radar.pipeline"]
    environment: *common-env
    volumes:
      - ./data:/app/data
      - ./tiles:/app/tiles
    depends_on:
      - redis
    networks: [internal]
    profiles: ["tools"]

  api:
    build: .
    image: iuu-radar:latest
    environment: *common-env
    volumes:
      - ./data:/app/data:ro
      - ./tiles:/app/tiles:ro
    depends_on:
      - redis
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tiles:/srv/tiles:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
    # Host-side ports are configurable so this stack can coexist with another
    # reverse proxy already bound to 80/443 on a shared VPS; Caddy still
    # listens on the standard 80/443 inside the container. Point these back
    # to 80/443 once this project owns those ports on its host.
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    depends_on:
      - api
    networks: [internal]
    healthcheck:
      # "/" itself intentionally 404s (no directory listing, no unmapped
      # routes exposed); /api/health is the real liveness probe.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--bind", "0.0.0.0"]
    volumes:
      - redis_data:/data
    networks: [internal]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [internal]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [internal]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    networks: [internal]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [internal]
    restart: unless-stopped

  # Opt-in Kafka-API event log, showcasing an event-driven design. Not required
  # by this project's data volume; Redis is the default. Enable with
  # `docker compose --profile streaming up`.
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks: [internal]
    profiles: ["streaming"]

networks:
  internal:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  redpanda_data:
