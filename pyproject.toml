[project]
name = "iuu-fishing-radar"
version = "0.1.0"
description = "Open-data pipeline and live map detecting anomalous fishing vessel behavior around Marine Protected Areas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gfw-api-python-client",
    "httpx",
    "duckdb",
    "dbt-duckdb",
    "geopandas",
    "shapely",
    "h3",
    "pyod",
    "scikit-learn",
    "fastapi",
    "uvicorn[standard]",
    "redis",
    "prefect",
    "pydantic-settings",
    "pyyaml",
    "prometheus-fastapi-instrumentator",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iuu_radar"]
