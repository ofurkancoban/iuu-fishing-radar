version: 2

models:
  # int_mpa_buffered and mart_events_mpa are populated by Python in bounded,
  # per-region batches (spatial/mpa_buffer.py, spatial/events_mpa_join.py),
  # not by dbt SQL models (see those modules' docstrings for why), so they
  # have no dbt schema tests here; their correctness is covered by
  # tests/test_events_mpa_join.py and tests/test_mpa_buffer.py instead.

  - name: mart_vessel_effort
    description: Base per-vessel aggregation of fishing effort and events by proximity zone.
    columns:
      - name: vessel_id
        tests: [not_null]
