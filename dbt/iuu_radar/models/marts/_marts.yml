version: 2

models:
  - name: int_mpa_buffered
    description: >
      MPA geometry pre-buffered by the edge distance and R-tree indexed, so
      mart_events_mpa's spatial join can probe an index instead of cross
      joining every event against every MPA.
    columns:
      - name: mpa_id
        tests: [not_null]

  # mart_events_mpa is populated by spatial/events_mpa_join.py in bounded
  # batches, not by a dbt SQL model (see that module's docstring for why),
  # so it has no dbt schema tests here; its correctness is covered by
  # tests/test_events_mpa_join.py instead.

  - name: mart_vessel_effort
    description: Base per-vessel aggregation of fishing effort and events by proximity zone.
    columns:
      - name: vessel_id
        tests: [not_null]
