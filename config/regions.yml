# Region and MPA definitions. Add one entry per region; the pipeline iterates
# over all regions unless a single region is requested via CLI/env.
#
# bbox is [min_lon, min_lat, max_lon, max_lat] in WGS84.

default:
  name: "Galapagos Marine Reserve (demo)"
  description: >
    Small, well-studied region used for fast iteration during development.
  bbox: [-92.5, -1.8, -88.5, 1.8]
  date_range:
    start: "2024-01-01"
    end: "2024-03-31"
  mpa:
    # WDPA designation filter or explicit WDPA ids can be added here once
    # ingest/wdpa.py is implemented.
    wdpa_ids: []
    edge_buffer_km: 10
  h3:
    resolution: 6
  gfw:
    datasets:
      - "public-global-fishing-effort:v20231026"
    event_types:
      - "fishing"
      - "encounter"
      - "loitering"
      - "port_visit"
      - "gap"

global:
  name: "Global (all oceans)"
  description: >
    Worldwide coverage, all oceans. Large by design: used to demonstrate the
    pipeline at global scale. Data volume and runtime are both significant
    at this bbox; the spatial join relies on int_mpa_buffered's R-tree index
    to stay tractable against the full worldwide MPA set.
  bbox: [-180.0, -85.0, 180.0, 85.0]
  date_range:
    start: "2024-01-01"
    end: "2024-03-31"
  mpa:
    wdpa_ids: []
    edge_buffer_km: 10
  h3:
    resolution: 5
  gfw:
    datasets:
      - "public-global-fishing-effort:v20231026"
    event_types:
      - "fishing"
      - "encounter"
      - "loitering"
      - "port_visit"
      - "gap"

turkey_seas:
  name: "Turkey: Black Sea, Marmara, and Aegean coasts"
  description: >
    Turkish coastal waters across the Black Sea, Sea of Marmara, and Aegean
    Sea, covering MPAs such as the Datca-Bozburun and Gokova Special
    Environmental Protection Areas.
  bbox: [23.0, 35.5, 42.0, 43.0]
  date_range:
    start: "2024-01-01"
    end: "2024-03-31"
  mpa:
    wdpa_ids: []
    edge_buffer_km: 10
  h3:
    resolution: 6
  gfw:
    datasets:
      - "public-global-fishing-effort:v20231026"
    event_types:
      - "fishing"
      - "encounter"
      - "loitering"
      - "port_visit"
      - "gap"
