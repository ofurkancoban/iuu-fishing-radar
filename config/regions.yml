# Region and MPA definitions. Add one entry per region; the pipeline iterates
# over all regions unless a single region is requested via CLI/env.
#
# bbox is [min_lon, min_lat, max_lon, max_lat] in WGS84.
#
# A single worldwide bbox was tried and reverted: even after paginating events
# and splitting the 4Wings fishing-effort report by month, a single global
# month's vessel-level effort report alone grew past what an 11GB shared VPS
# can hold in memory (observed ~5.8GB and still climbing before being killed
# manually). Named regional bboxes covering real high-activity fishing areas
# give broad world coverage without that failure mode.

default:
  name: "Galapagos Marine Reserve (demo)"
  description: >
    Small, well-studied region used for fast iteration during development.
  bbox: [-92.5, -1.8, -88.5, 1.8]
  date_range:
    start: "2024-01-01"
    end: "2024-03-31"
  mpa:
    wdpa_ids: []
    edge_buffer_km: 10
  h3:
    resolution: 6
  gfw:
    datasets:
      - "public-global-fishing-effort:v20231026"
    event_types:
      - "fishing"
      - "encounter"
      - "loitering"
      - "port_visit"
      - "gap"

